name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly (Mondays 06:00 UTC), to catch breakage from new nightlies.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          rustup toolchain install ${{ matrix.toolchain }}
          --profile minimal --target x86_64-unknown-none
      - run: cargo +${{ matrix.toolchain }} build --target x86_64-unknown-none
      - run: cargo +${{ matrix.toolchain }} doc --no-deps --target x86_64-unknown-none

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check
